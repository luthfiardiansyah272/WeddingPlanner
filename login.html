<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Wedding Planner</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .input-wrap { position: relative; }
    .input-wrap input { padding-right: 44px; }
    .toggle-eye {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      font-size: 1.1rem; color: var(--text-light); padding: 0; line-height: 1;
    }
    .toggle-eye:hover { color: var(--primary-dark); }
    .forgot-link {
      display: block; text-align: right; font-size: 0.8rem;
      color: var(--primary-dark); margin-top: -8px; margin-bottom: 1rem; cursor: pointer;
    }
    .forgot-link:hover { text-decoration: underline; }
    .reset-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(90,62,62,0.35); z-index: 200;
      align-items: center; justify-content: center;
    }
    .reset-overlay.active { display: flex; }
    .reset-modal {
      background: var(--white); border-radius: var(--radius); padding: 2rem;
      width: 90%; max-width: 400px;
      box-shadow: 0 8px 30px rgba(180,120,120,0.22);
      animation: slideUp 0.25s ease; text-align: center;
    }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .reset-modal h3 { color: var(--primary-dark); margin-bottom: 0.5rem; }
    .reset-modal p { font-size: 0.85rem; color: var(--text-light); margin-bottom: 1.5rem; }
    #reset-success { display: none; }
  </style>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="logo">💍</div>
    <h2>Wedding Planner</h2>
    <p>Rencanakan hari istimewa Anda dengan mudah</p>

    <div class="tab-switch">
      <button id="tab-login-btn" class="active">Masuk</button>
      <button id="tab-register-btn">Daftar</button>
    </div>

    <!-- LOGIN FORM -->
    <form id="form-login">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="email@contoh.com" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <input type="password" id="login-pass" placeholder="Password" required />
          <button type="button" class="toggle-eye" id="eye-login">👁️</button>
        </div>
      </div>
      <span class="forgot-link" id="forgot-link">Lupa password?</span>
      <p id="login-err" style="color:var(--danger);font-size:0.8rem;margin-bottom:1rem;display:none"></p>
      <button type="submit" id="btn-login" class="btn btn-primary" style="width:100%;justify-content:center">Masuk</button>
    </form>

    <!-- REGISTER FORM -->
    <form id="form-register" style="display:none">
      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" id="reg-name" placeholder="Nama kamu" required />
      </div>
      <div class="form-group">
        <label>Nama Pasangan</label>
        <input type="text" id="reg-partner" placeholder="Nama pasangan" required />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="email@contoh.com" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <input type="password" id="reg-pass" placeholder="Minimal 6 karakter" required minlength="6" />
          <button type="button" class="toggle-eye" id="eye-register">👁️</button>
        </div>
      </div>
      <div class="form-group">
        <label>Tanggal Pernikahan</label>
        <input type="date" id="reg-date" required />
      </div>
      <p id="reg-err" style="color:var(--danger);font-size:0.8rem;margin-bottom:1rem;display:none"></p>
      <button type="submit" id="btn-register" class="btn btn-primary" style="width:100%;justify-content:center">Daftar Sekarang</button>
    </form>
  </div>
</div>

<!-- MODAL LUPA PASSWORD -->
<div class="reset-overlay" id="reset-overlay">
  <div class="reset-modal">
    <div id="reset-form-wrap">
      <div style="font-size:2rem;margin-bottom:0.5rem">🔑</div>
      <h3>Lupa Password?</h3>
      <p>Masukkan email kamu, kami akan kirim link reset password.</p>
      <div class="form-group" style="text-align:left">
        <label>Email</label>
        <input type="email" id="reset-email" placeholder="email@contoh.com" />
      </div>
      <p id="reset-err" style="color:var(--danger);font-size:0.8rem;margin-bottom:1rem;display:none"></p>
      <div style="display:flex;gap:0.8rem">
        <button id="btn-reset" class="btn btn-primary" style="flex:1;justify-content:center">Kirim Link Reset</button>
        <button id="btn-reset-cancel" class="btn btn-outline">Batal</button>
      </div>
    </div>
    <div id="reset-success">
      <div style="font-size:3rem;margin-bottom:1rem">📧</div>
      <h3 style="color:var(--primary-dark);margin-bottom:0.5rem">Email Terkirim!</h3>
      <p style="margin-bottom:1.5rem">Link reset password sudah dikirim ke <strong id="reset-email-sent"></strong>. Cek inbox atau folder spam kamu.</p>
      <button id="btn-reset-ok" class="btn btn-primary" style="width:100%;justify-content:center">Oke, Mengerti</button>
    </div>
  </div>
</div>

<script type="module">
  import { Auth } from './js/firebase.js';

  // Redirect jika sudah login
  Auth.redirectIfLoggedIn();

  // ===== TAB SWITCH =====
  document.getElementById('tab-login-btn').addEventListener('click', () => {
    document.getElementById('tab-login-btn').classList.add('active');
    document.getElementById('tab-register-btn').classList.remove('active');
    document.getElementById('form-login').style.display = 'block';
    document.getElementById('form-register').style.display = 'none';
  });

  document.getElementById('tab-register-btn').addEventListener('click', () => {
    document.getElementById('tab-register-btn').classList.add('active');
    document.getElementById('tab-login-btn').classList.remove('active');
    document.getElementById('form-register').style.display = 'block';
    document.getElementById('form-login').style.display = 'none';
  });

  // ===== TOGGLE PASSWORD =====
  document.getElementById('eye-login').addEventListener('click', () => {
    const inp = document.getElementById('login-pass');
    const btn = document.getElementById('eye-login');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    btn.textContent = inp.type === 'password' ? '👁️' : '🙈';
  });

  document.getElementById('eye-register').addEventListener('click', () => {
    const inp = document.getElementById('reg-pass');
    const btn = document.getElementById('eye-register');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    btn.textContent = inp.type === 'password' ? '👁️' : '🙈';
  });

  // ===== LOGIN =====
  document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-login');
    const errEl = document.getElementById('login-err');
    errEl.style.display = 'none';
    btn.textContent = 'Memuat...';
    btn.disabled = true;
    const res = await Auth.login(
      document.getElementById('login-email').value.trim(),
      document.getElementById('login-pass').value
    );
    if (res.ok) {
      window.location.replace('index.html');
    } else {
      errEl.textContent = res.msg;
      errEl.style.display = 'block';
      btn.textContent = 'Masuk';
      btn.disabled = false;
    }
  });

  // ===== REGISTER =====
  document.getElementById('form-register').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-register');
    const errEl = document.getElementById('reg-err');
    errEl.style.display = 'none';
    btn.textContent = 'Memuat...';
    btn.disabled = true;
    const res = await Auth.register(
      document.getElementById('reg-name').value.trim(),
      document.getElementById('reg-email').value.trim(),
      document.getElementById('reg-pass').value,
      document.getElementById('reg-date').value,
      document.getElementById('reg-partner').value.trim()
    );
    if (res.ok) {
      window.location.replace('index.html');
    } else {
      errEl.textContent = res.msg;
      errEl.style.display = 'block';
      btn.textContent = 'Daftar Sekarang';
      btn.disabled = false;
    }
  });

  // ===== LUPA PASSWORD =====
  document.getElementById('forgot-link').addEventListener('click', () => {
    document.getElementById('reset-email').value = document.getElementById('login-email').value || '';
    document.getElementById('reset-err').style.display = 'none';
    document.getElementById('reset-form-wrap').style.display = 'block';
    document.getElementById('reset-success').style.display = 'none';
    document.getElementById('btn-reset').textContent = 'Kirim Link Reset';
    document.getElementById('btn-reset').disabled = false;
    document.getElementById('reset-overlay').classList.add('active');
  });

  document.getElementById('btn-reset-cancel').addEventListener('click', () => {
    document.getElementById('reset-overlay').classList.remove('active');
  });

  document.getElementById('btn-reset-ok').addEventListener('click', () => {
    document.getElementById('reset-overlay').classList.remove('active');
  });

  document.getElementById('reset-overlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('reset-overlay')) {
      document.getElementById('reset-overlay').classList.remove('active');
    }
  });

  document.getElementById('btn-reset').addEventListener('click', async () => {
    const email = document.getElementById('reset-email').value.trim();
    const errEl = document.getElementById('reset-err');
    const btn = document.getElementById('btn-reset');
    if (!email) {
      errEl.textContent = 'Masukkan email kamu';
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';
    btn.textContent = 'Mengirim...';
    btn.disabled = true;
    const res = await Auth.resetPassword(email);
    if (res.ok) {
      document.getElementById('reset-email-sent').textContent = email;
      document.getElementById('reset-form-wrap').style.display = 'none';
      document.getElementById('reset-success').style.display = 'block';
    } else {
      errEl.textContent = res.msg;
      errEl.style.display = 'block';
      btn.textContent = 'Kirim Link Reset';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
