<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Wedding Planner</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="logo">💍</div>
    <h2>Wedding Planner</h2>
    <p>Rencanakan hari istimewa Anda dengan mudah</p>

    <div class="tab-switch">
      <button class="active" onclick="switchTab('login')">Masuk</button>
      <button onclick="switchTab('register')">Daftar</button>
    </div>

    <form id="form-login" onsubmit="doLogin(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="email@contoh.com" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-pass" placeholder="Password" required />
      </div>
      <p id="login-err" style="color:var(--danger);font-size:0.8rem;margin-bottom:1rem;display:none"></p>
      <button type="submit" id="btn-login" class="btn btn-primary" style="width:100%;justify-content:center">Masuk</button>
    </form>

    <form id="form-register" style="display:none" onsubmit="doRegister(event)">
      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" id="reg-name" placeholder="Nama kamu" required />
      </div>
      <div class="form-group">
        <label>Nama Pasangan</label>
        <input type="text" id="reg-partner" placeholder="Nama pasangan" required />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="email@contoh.com" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-pass" placeholder="Minimal 6 karakter" required minlength="6" />
      </div>
      <div class="form-group">
        <label>Tanggal Pernikahan</label>
        <input type="date" id="reg-date" required />
      </div>
      <p id="reg-err" style="color:var(--danger);font-size:0.8rem;margin-bottom:1rem;display:none"></p>
      <button type="submit" id="btn-register" class="btn btn-primary" style="width:100%;justify-content:center">Daftar Sekarang</button>
    </form>
  </div>
</div>

<script type="module">
  import { Auth } from './js/firebase.js';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { auth } from './js/firebase.js';

  // Cek sekali saja - jika sudah login langsung ke dashboard
  const unsubscribe = onAuthStateChanged(auth, user => {
    unsubscribe();
    if (user) window.location.replace('index.html');
  });

  window.switchTab = (tab) => {
    document.querySelectorAll('.tab-switch button').forEach((b, i) => {
      b.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'register' && i === 1));
    });
    document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
  };

  window.doLogin = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-login');
    btn.textContent = 'Memuat...'; btn.disabled = true;
    const res = await Auth.login(
      document.getElementById('login-email').value,
      document.getElementById('login-pass').value
    );
    if (res.ok) window.location.replace('index.html');
    else {
      const el = document.getElementById('login-err');
      el.textContent = res.msg; el.style.display = 'block';
      btn.textContent = 'Masuk'; btn.disabled = false;
    }
  };

  window.doRegister = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-register');
    btn.textContent = 'Memuat...'; btn.disabled = true;
    const res = await Auth.register(
      document.getElementById('reg-name').value,
      document.getElementById('reg-email').value,
      document.getElementById('reg-pass').value,
      document.getElementById('reg-date').value,
      document.getElementById('reg-partner').value
    );
    if (res.ok) window.location.replace('index.html');
    else {
      const el = document.getElementById('reg-err');
      el.textContent = res.msg; el.style.display = 'block';
      btn.textContent = 'Daftar Sekarang'; btn.disabled = false;
    }
  };
</script>
</body>
</html>
