<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checklist – Sakinah</title>
  <link rel="stylesheet" href="css/style.css" />
  <script defer src="js/nav-fix.js"></script>
  <style>
    .checklist-item { display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--radius-sm);transition:background 0.2s;border-bottom:1px solid var(--primary-bg); }
    .checklist-item:last-child { border-bottom:none; }
    .checklist-item:hover { background:var(--bg); }
    .checklist-item.done .task-text { text-decoration:line-through;color:var(--text-2); }
    .check-box { width:22px;height:22px;border-radius:6px;border:2px solid var(--primary);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;background:white; }
    .check-box.checked { background:var(--primary);border-color:var(--primary); }
    .check-box.checked::after { content:'✓';color:white;font-size:13px;font-weight:700; }
    .priority-dot { width:8px;height:8px;border-radius:50%;flex-shrink:0; }
    .p-tinggi { background:var(--danger); } .p-sedang { background:var(--warning); } .p-rendah { background:var(--success); }
    .progress-ring { position:relative;display:inline-flex;align-items:center;justify-content:center; }
    .progress-ring svg { transform:rotate(-90deg); }
    .progress-ring .pct-text { position:absolute;font-size:1.4rem;font-weight:700;color:var(--primary-dark);font-family:'Inter',sans-serif; }
  </style>
</head>
<body>

  <button class="nav-toggle" id="nav-toggle" onclick="document.getElementById('nav-links').classList.toggle('open')"><span></span><span></span><span></span></button>
  <div class="nav-links" id="nav-links">
    <a href="index.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> <span>Dashboard</span></a>

    <a href="vendors.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> <span>Vendor</span></a>

    <a href="checklist.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg> <span>Checklist</span></a>
    <a href="seserahan.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg> <span>Seserahan</span></a>

  </div>

</nav>

<div class="container">
  <div class="page-header">
    <div><h2>Checklist Persiapan</h2><p>Pantau semua persiapan pernikahan Anda</p></div>
    <button class="btn btn-primary" onclick="openAddModal()">+ Tambah Tugas</button>
  </div>

  <div class="card" style="margin-bottom:1.5rem">
    <div style="display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap">
      <div class="progress-ring" style="flex-shrink:0">
        <svg width="90" height="90" viewBox="0 0 110 110">
          <circle cx="55" cy="55" r="46" fill="none" stroke="var(--primary-bg)" stroke-width="10"/>
          <circle id="ring-fill" cx="55" cy="55" r="46" fill="none" stroke="var(--primary)" stroke-width="10" stroke-dasharray="289" stroke-dashoffset="289" stroke-linecap="round"/>
        </svg>
        <span class="pct-text" id="pct-text" style="font-size:1.1rem">0%</span>
      </div>
      <div style="flex:1;min-width:0">
        <h3 style="font-size:1.1rem;color:var(--primary-dark);margin-bottom:0.5rem" id="progress-title">Mulai persiapan!</h3>
        <div style="display:flex;gap:1.2rem;flex-wrap:wrap">
          <div><span style="font-size:1.3rem;font-weight:700;color:var(--success)" id="done-count">0</span><p style="font-size:0.75rem;color:var(--text-2)">Selesai</p></div>
          <div><span style="font-size:1.3rem;font-weight:700;color:var(--warning)" id="pending-count">0</span><p style="font-size:0.75rem;color:var(--text-2)">Belum</p></div>
          <div><span style="font-size:1.3rem;font-weight:700;color:var(--text)" id="total-count">0</span><p style="font-size:0.75rem;color:var(--text-2)">Total</p></div>
        </div>
      </div>
    </div>
  </div>

  <div class="filter-bar">
    <select id="filter-cat" onchange="renderFilter()"><option value="">Semua Kategori</option></select>
    <select id="filter-status" onchange="renderFilter()"><option value="">Semua Status</option><option value="done">Selesai</option><option value="pending">Belum</option></select>
    <select id="filter-priority" onchange="renderFilter()"><option value="">Semua Prioritas</option><option value="Tinggi">Tinggi</option><option value="Sedang">Sedang</option><option value="Rendah">Rendah</option></select>
  </div>

  <div class="card" id="checklist-container"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-task">
  <div class="modal">
    <div class="modal-header"><h3 id="modal-task-title">Tambah Tugas</h3><button class="btn-close" onclick="closeModal('modal-task')">✕</button></div>
    <input type="hidden" id="t-edit-id" />
    <div class="form-group"><label>Nama Tugas</label><input type="text" id="t-task" placeholder="Contoh: Booking fotografer" /></div>
    <div class="grid-2">
      <div class="form-group"><label>Kategori</label><input type="text" id="t-category" placeholder="Contoh: Dokumentasi" list="cat-list" /><datalist id="cat-list"></datalist></div>
      <div class="form-group"><label>Prioritas</label><select id="t-priority"><option>Tinggi</option><option>Sedang</option><option>Rendah</option></select></div>
    </div>
    <div class="form-group"><label>Catatan</label><textarea id="t-note" rows="2" placeholder="Catatan tambahan..."></textarea></div>
    <div style="display:flex;gap:0.8rem;position:sticky;bottom:0;background:var(--surface);padding-top:1rem;margin-top:0.5rem">
      <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="saveTask()">Simpan</button>
      <button class="btn btn-outline" onclick="closeModal('modal-task')">Batal</button>
    </div>
  </div>
</div>

<script type="module">
  import { Auth, Checklist, setupNav, toast, openModal, closeModal, showLoading } from './js/firebase.js';

  window.doLogout = () => Auth.logout();
  window.openModal = openModal;
  window.closeModal = closeModal;

  let uid, allItems = [];
  const priorityClass = { Tinggi:'p-tinggi', Sedang:'p-sedang', Rendah:'p-rendah' };

  function updateProgress() {
    const prog = Checklist.progress(allItems);
    const offset = 289 - (prog.pct / 100 * 289);
    document.getElementById('ring-fill').style.strokeDashoffset = offset;
    document.getElementById('pct-text').textContent = prog.pct + '%';
    document.getElementById('done-count').textContent = prog.done;
    document.getElementById('pending-count').textContent = prog.total - prog.done;
    document.getElementById('total-count').textContent = prog.total;
    document.getElementById('progress-title').textContent =
      prog.pct===100?'Semua persiapan selesai!':prog.pct>=75?'Hampir selesai!':prog.pct>=50?'Setengah jalan!':prog.pct>=25?'Terus semangat!':'Mulai persiapan!';
  }

  window.renderFilter = () => {
    const cat = document.getElementById('filter-cat').value;
    const status = document.getElementById('filter-status').value;
    const priority = document.getElementById('filter-priority').value;

    const cats = [...new Set(allItems.map(t => t.category))];
    const catEl = document.getElementById('filter-cat');
    const curCat = catEl.value;
    catEl.innerHTML = '<option value="">Semua Kategori</option>' + cats.map(c => `<option ${c===curCat?'selected':''}>${c}</option>`).join('');
    document.getElementById('cat-list').innerHTML = cats.map(c => `<option value="${c}">`).join('');

    let items = allItems.filter(t =>
      (!cat || t.category === cat) &&
      (!status || (status==='done'?t.done:!t.done)) &&
      (!priority || t.priority === priority)
    );

    const grouped = {};
    items.forEach(t => { if (!grouped[t.category]) grouped[t.category]=[]; grouped[t.category].push(t); });

    const el = document.getElementById('checklist-container');
    if (!items.length) { el.innerHTML = '<div class="empty-state"><p>Tidak ada tugas ditemukan.</p></div>'; return; }

    el.innerHTML = Object.entries(grouped).map(([cat, tasks]) => `
      <div style="margin-bottom:1rem">
        <div style="font-size:0.8rem;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:1px;padding:8px 16px;background:var(--primary-bg);border-radius:var(--radius-sm);margin-bottom:4px">${cat}</div>
        ${tasks.map(t => `
          <div class="checklist-item ${t.done?'done':''}">
            <div class="check-box ${t.done?'checked':''}" onclick="toggleTask('${t.id}',${t.done})"></div>
            <span class="priority-dot ${priorityClass[t.priority]||'p-rendah'}"></span>
            <div style="flex:1;min-width:0">
              <div class="task-text" style="font-size:0.88rem;font-weight:500;word-break:break-word">${t.task}</div>
              ${t.note?`<div style="font-size:0.75rem;color:var(--text-2);margin-top:2px">${t.note}</div>`:''}
            </div>
            <div style="display:flex;align-items:center;gap:4px;flex-shrink:0">
              <span class="badge ${t.priority==='Tinggi'?'badge-pink':t.priority==='Sedang'?'badge-yellow':'badge-green'}" style="font-size:0.65rem">${t.priority}</span>
              <button class="btn btn-outline btn-sm" onclick="editTask('${t.id}')" style="padding:3px 8px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
              <button class="btn btn-danger btn-sm" onclick="deleteTask('${t.id}')" style="padding:3px 8px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>
            </div>
          </div>`).join('')}
      </div>`).join('');
  };

  window.toggleTask = async (id, done) => {
    await Checklist.toggle(uid, id, done);
    allItems = await Checklist.getAll(uid);
    updateProgress(); renderFilter();
  };

  window.openAddModal = () => {
    document.getElementById('t-edit-id').value = '';
    document.getElementById('modal-task-title').textContent = 'Tambah Tugas';
    ['t-task','t-category','t-note'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('t-priority').value = 'Sedang';
    openModal('modal-task');
  };

  window.editTask = (id) => {
    const t = allItems.find(x => x.id === id);
    if (!t) return;
    document.getElementById('t-edit-id').value = id;
    document.getElementById('modal-task-title').textContent = 'Edit Tugas';
    document.getElementById('t-task').value = t.task;
    document.getElementById('t-category').value = t.category;
    document.getElementById('t-priority').value = t.priority;
    document.getElementById('t-note').value = t.note||'';
    openModal('modal-task');
  };

  window.saveTask = async () => {
    const task = document.getElementById('t-task').value.trim();
    if (!task) return toast('Nama tugas wajib diisi', 'error');
    const id = document.getElementById('t-edit-id').value;
    const data = { task, category: document.getElementById('t-category').value||'Lainnya', priority: document.getElementById('t-priority').value, note: document.getElementById('t-note').value, done: false };
    if (id) { data.done = allItems.find(t=>t.id===id)?.done||false; await Checklist.update(uid, id, data); }
    else await Checklist.add(uid, data);
    allItems = await Checklist.getAll(uid);
    closeModal('modal-task'); toast(id?'Tugas diperbarui':'Tugas ditambahkan');
    updateProgress(); renderFilter();
  };

  window.deleteTask = async (id) => {
    if (!confirm('Hapus tugas ini?')) return;
    await Checklist.delete(uid, id);
    allItems = await Checklist.getAll(uid);
    toast('Tugas dihapus'); updateProgress(); renderFilter();
  };

  Auth.requireAuth(async (user) => {
    showLoading(true);
    uid = user.uid;
    const profile = await Auth.getProfile();
    setupNav(profile);
    allItems = await Checklist.getAll(uid);
    updateProgress(); renderFilter();
    showLoading(false);
  });
</script>
<script src="js/music-player.js"></script>
