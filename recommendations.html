<nav>

  <button class="nav-toggle" id="nav-toggle" onclick="document.getElementById('nav-links').classList.toggle('open')"><span></span><span></span><span></span></button>
  <div class="nav-links" id="nav-links"><a href="index.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> <span>Dashboard</span></a><a href="budget.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg> <span>Budget</span></a><a href="vendors.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> <span>Vendor</span></a><a href="recommendations.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> <span>Rekomendasi</span></a><a href="checklist.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg> <span>Checklist</span></a><a href="seserahan.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg> <span>Seserahan</span></a><a href="guestlist.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> <span>Tamu</span></a><a href="timeline.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> <span>Timeline</span></a><a href="panitia.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg> <span>Panitia</span></a><a href="profile.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> <span>Profil</span></a></div>
  <div class="nav-user">
    <span id="nav-user-name"></span>
    <button class="btn-logout" onclick="doLogout()">Keluar</button>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <div><h2>Rekomendasi Vendor</h2><p>Temukan vendor terbaik untuk pernikahan Anda</p></div>
    <button class="btn btn-primary" onclick="openAddModal()">+ Tambah Rekomendasi</button>
  </div>

  <div id="region-tabs" style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:1rem"></div>

  <div class="filter-bar">
    <input type="text" id="search" placeholder="Cari nama, kota, kategori..." oninput="renderFilter()" />
    <select id="filter-cat" onchange="renderFilter()">
      <option value="">Semua Kategori</option>
      <option>Fotografer</option><option>Katering</option><option>Dekorasi</option>
      <option>Hiburan</option><option>Venue</option><option>MUA</option>
      <option>Videografer</option><option>Bunga</option><option>Lainnya</option>
    </select>
    <select id="filter-rating" onchange="renderFilter()">
      <option value="">Semua Rating</option>
      <option value="5">5 Bintang</option>
      <option value="4">4+ Bintang</option>
      <option value="3">3+ Bintang</option>
    </select>
    <select id="filter-price" onchange="renderFilter()">
      <option value="">Semua Harga</option>
      <option value="5000000">Di bawah Rp 5 Juta</option>
      <option value="10000000">Di bawah Rp 10 Juta</option>
      <option value="20000000">Di bawah Rp 20 Juta</option>
      <option value="50000000">Di bawah Rp 50 Juta</option>
    </select>
  </div>

  <div id="rec-stats" style="margin-bottom:1rem;font-size:0.85rem;color:var(--text-2)"></div>
  <div id="rec-list"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-rec">
  <div class="modal" style="max-width:520px">
    <div class="modal-header"><h3 id="modal-rec-title">Tambah Rekomendasi</h3><button class="btn-close" onclick="closeModal('modal-rec')">✕</button></div>
    <input type="hidden" id="r-edit-id" />
    <div class="grid-2">
      <div class="form-group"><label>Nama Vendor</label><input type="text" id="r-name" placeholder="Nama vendor" /></div>
      <div class="form-group"><label>Kategori</label>
        <select id="r-category"><option>Fotografer</option><option>Katering</option><option>Dekorasi</option><option>Hiburan</option><option>Venue</option><option>MUA</option><option>Videografer</option><option>Bunga</option><option>Lainnya</option></select>
      </div>
    </div>
    <div class="grid-2">
      <div class="form-group"><label>Harga Mulai (Rp)</label><input type="number" id="r-price" placeholder="0" min="0" /></div>
      <div class="form-group"><label>Lokasi</label><input type="text" id="r-location" placeholder="Kota" /></div>
    </div>
    <div class="grid-2">
      <div class="form-group"><label>Kontak</label><input type="text" id="r-contact" placeholder="No. HP / Email" /></div>
      <div class="form-group"><label>Rating</label>
        <select id="r-rating"><option value="5">5 bintang</option><option value="4">4 bintang</option><option value="3">3 bintang</option><option value="2">2 bintang</option><option value="1">1 bintang</option></select>
      </div>
    </div>
    <div class="grid-2">
      <div class="form-group"><label>Ikon (opsional)</label><input type="text" id="r-emoji" placeholder="Opsional" maxlength="4" /></div>
      <div class="form-group"><label>Region / Provinsi</label>
        <input type="text" id="r-region" placeholder="Contoh: Lampung" list="region-list" />
        <datalist id="region-list">
          <option value="Lampung"><option value="Jakarta"><option value="Jawa Barat">
          <option value="Yogyakarta"><option value="Jawa Timur"><option value="Jawa Tengah">
          <option value="Sumatera Utara"><option value="Sumatera Selatan">
          <option value="Sulawesi Selatan"><option value="Bali"><option value="Kalimantan">
          <option value="Papua"><option value="Aceh"><option value="Riau">
        </datalist>
      </div>
    </div>
    <div class="form-group"><label>Deskripsi</label><textarea id="r-desc" rows="2" placeholder="Deskripsi singkat vendor..."></textarea></div>
    <div style="display:flex;gap:0.8rem;position:sticky;bottom:0;background:var(--white);padding-top:1rem;margin-top:0.5rem">
      <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="saveRec()">Simpan</button>
      <button class="btn btn-outline" onclick="closeModal('modal-rec')">Batal</button>
    </div>
  </div>
</div>

<script type="module">
  import { Auth, Vendor, Recommendation, fmt, stars, setupNav, toast, openModal, closeModal, showLoading } from './js/firebase.js';

  window.doLogout = () => Auth.logout();
  window.openModal = openModal;
  window.closeModal = closeModal;

  let uid, allRecs = [], activeRegion = '';
  const catEmoji = { Venue:'Ve', Katering:'Ka', Fotografer:'Fo', Videografer:'Vi', Dekorasi:'De', MUA:'MU', Hiburan:'Hi', Bunga:'Bu', Lainnya:'La' };
  const catColor = { Venue:'#e8dfd5', Katering:'#d4e4d1', Fotografer:'#e0e8f0', Videografer:'#ede0f0', Dekorasi:'#f0e8e0', MUA:'#f0d4d4', Hiburan:'#d4e4f0', Bunga:'#f0e4d4', Lainnya:'#e8e8e8' };
  const regionFlag = {};

  function buildRegionTabs() {
    const regions = ['', ...new Set(allRecs.map(r => r.region).filter(Boolean))];
    document.getElementById('region-tabs').innerHTML = regions.map(r => `
      <button onclick="setRegion('${r}')" class="btn btn-sm ${activeRegion===r?'btn-primary':'btn-outline'}" style="border-radius:20px">
        ${r || 'Semua Region'}
      </button>`).join('');
  }

  window.setRegion = (r) => { activeRegion = r; buildRegionTabs(); renderFilter(); };

  window.renderFilter = () => {
    const search = document.getElementById('search').value.toLowerCase();
    const cat = document.getElementById('filter-cat').value;
    const minRating = parseInt(document.getElementById('filter-rating').value)||0;
    const maxPrice = parseInt(document.getElementById('filter-price').value)||0;

    let recs = allRecs.filter(r =>
      (!search || r.name.toLowerCase().includes(search) || r.category.toLowerCase().includes(search) || (r.location||'').toLowerCase().includes(search) || (r.region||'').toLowerCase().includes(search)) &&
      (!cat || r.category === cat) && (!activeRegion || r.region === activeRegion) &&
      (r.rating >= minRating) && (!maxPrice || (r.price||0) < maxPrice)
    );

    document.getElementById('rec-stats').textContent = `Menampilkan ${recs.length} vendor${activeRegion?' di '+activeRegion:''}`;

    const el = document.getElementById('rec-list');
    if (!recs.length) { el.innerHTML = '<div class="empty-state card"><p>Tidak ada rekomendasi ditemukan.</p></div>'; return; }

    if (!activeRegion && !search && !cat && !minRating && !maxPrice) {
      const grouped = {};
      recs.forEach(r => { const k = r.region||'Lainnya'; if (!grouped[k]) grouped[k]=[]; grouped[k].push(r); });
      el.innerHTML = Object.entries(grouped).map(([region, items]) => `
        <div style="margin-bottom:2rem">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:1rem">
            <h3 style="font-size:1rem;color:var(--text);font-weight:600">${region}</h3>
            <span class="badge badge-pink">${items.length} vendor</span>
          </div>
          <div class="grid-3">${items.map(r => vendorCard(r)).join('')}</div>
        </div>`).join('');
    } else {
      el.innerHTML = `<div class="grid-3">${recs.map(r => vendorCard(r)).join('')}</div>`;
    }
  };

  function vendorCard(r) {
    return `<div class="vendor-card">
      <div class="vendor-card-img" style="position:relative;background:${catColor[r.category]||'#f0f0f0'}">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.3;color:#666"><path d="M20 7H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
        ${r.region?`<span style="position:absolute;top:8px;right:8px;font-size:0.68rem;background:rgba(255,255,255,0.92);padding:2px 7px;border-radius:6px;color:var(--text-2);font-weight:500">${r.region}</span>`:''}
      </div>
      <div class="vendor-card-body">
        <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:6px">
          <h4 style="font-size:0.95rem">${r.name}</h4>
          ${!r.isDefault?'<span style="font-size:0.65rem;color:var(--primary-dark);background:var(--primary-bg);padding:2px 7px;border-radius:10px">Custom</span>':''}
        </div>
        <span class="badge badge-pink" style="margin-bottom:8px;display:inline-block;font-size:0.72rem">${r.category}</span>
        <div class="price">Mulai ${fmt(r.price||0)}</div>
        <div style="font-size:0.78rem;color:var(--text-2);margin-bottom:3px">${r.location||'-'}</div>
        <div style="font-size:0.78rem;color:var(--text-2);margin-bottom:6px">${r.contact||'-'}</div>
        <div class="stars" style="font-size:0.85rem">${stars(r.rating||0)}</div>
        <p style="font-size:0.78rem;color:var(--text-2);margin-top:7px;line-height:1.5">${r.desc||''}</p>
      </div>
      <div class="vendor-card-footer">
        <button class="btn btn-outline btn-sm" style="flex:1;justify-content:center" onclick="addToMyVendor('${r.id}')">Pilih</button>
        <button class="btn btn-outline btn-sm" onclick="editRec('${r.id}')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
        <button class="btn btn-danger btn-sm" onclick="deleteRec('${r.id}')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>
      </div>
    </div>`;
  }

  window.addToMyVendor = async (id) => {
    const r = allRecs.find(x => x.id === id);
    if (!r) return;
    await Vendor.add(uid, { name:r.name, category:r.category, price:r.price, location:r.location, contact:r.contact, rating:r.rating, status:'Kandidat', note:r.desc||'' });
    toast(`${r.name} ditambahkan ke vendor saya`);
  };

  window.openAddModal = () => {
    document.getElementById('r-edit-id').value = '';
    document.getElementById('modal-rec-title').textContent = 'Tambah Rekomendasi';
    ['r-name','r-price','r-location','r-contact','r-desc','r-emoji','r-region'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('r-rating').value = '5';
    openModal('modal-rec');
  };

  window.editRec = (id) => {
    const r = allRecs.find(x => x.id === id);
    if (!r) return;
    document.getElementById('r-edit-id').value = id;
    document.getElementById('modal-rec-title').textContent = 'Edit Rekomendasi';
    document.getElementById('r-name').value = r.name;
    document.getElementById('r-category').value = r.category;
    document.getElementById('r-price').value = r.price||'';
    document.getElementById('r-location').value = r.location||'';
    document.getElementById('r-contact').value = r.contact||'';
    document.getElementById('r-rating').value = r.rating||5;
    document.getElementById('r-emoji').value = r.emoji||'';
    document.getElementById('r-desc').value = r.desc||'';
    document.getElementById('r-region').value = r.region||'';
    openModal('modal-rec');
  };

  window.saveRec = async () => {
    const name = document.getElementById('r-name').value.trim();
    if (!name) return toast('Nama vendor wajib diisi', 'error');
    const id = document.getElementById('r-edit-id').value;
    const data = {
      name, category: document.getElementById('r-category').value,
      price: parseFloat(document.getElementById('r-price').value)||0,
      location: document.getElementById('r-location').value,
      contact: document.getElementById('r-contact').value,
      rating: parseInt(document.getElementById('r-rating').value),
      emoji: document.getElementById('r-emoji').value || catEmoji[document.getElementById('r-category').value] || '',
      desc: document.getElementById('r-desc').value,
      region: document.getElementById('r-region').value,
    };
    if (id) await Recommendation.update(uid, id, data);
    else await Recommendation.add(uid, data);
    allRecs = await Recommendation.getAll(uid);
    closeModal('modal-rec'); buildRegionTabs();
    toast(id ? 'Rekomendasi diperbarui' : 'Rekomendasi ditambahkan');
    renderFilter();
  };

  window.deleteRec = async (id) => {
    if (!confirm('Hapus rekomendasi ini?')) return;
    await Recommendation.delete(uid, id);
    allRecs = await Recommendation.getAll(uid);
    buildRegionTabs(); toast('Rekomendasi dihapus'); renderFilter();
  };

  Auth.requireAuth(async (user) => {
    showLoading(true);
    uid = user.uid;
    const profile = await Auth.getProfile();
    setupNav(profile);
    allRecs = await Recommendation.getAll(uid);
    buildRegionTabs(); renderFilter();
    showLoading(false);
  });
</script>
<script src="js/music-player.js"></script>
</body>
</html>
