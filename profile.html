<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil – Sakinah</title>
  <link rel="stylesheet" href="css/style.css" />
  <script defer src="js/nav-fix.js"></script>
</head>
<body>
<nav>
  <a href="index.html" class="nav-brand"><span class="brand-icon">💍</span> Sakinah</a>
  <button class="nav-toggle" id="nav-toggle" onclick="document.getElementById('nav-links').classList.toggle('open')"><span></span><span></span><span></span></button>
  <div class="nav-links" id="nav-links"><a href="index.html">🏠 <span>Dashboard</span></a><a href="budget.html">💰 <span>Budget</span></a><a href="vendors.html">🤝 <span>Vendor</span></a><a href="recommendations.html">⭐ <span>Rekomendasi</span></a><a href="checklist.html">✅ <span>Checklist</span></a><a href="seserahan.html">🎁 <span>Seserahan</span></a><a href="guestlist.html">👥 <span>Tamu</span></a><a href="timeline.html">🕐 <span>Timeline</span></a><a href="panitia.html">👔 <span>Panitia</span></a><a href="profile.html">👤 <span>Profil</span></a></div>
  <div class="nav-user"><span class="nav-user-name" id="nav-user-name"></span><button class="btn-logout" onclick="doLogout()">Keluar</button></div>
</nav>

<div class="container">
  <div class="page-header">
    <div><h2>👤 Profil & Pengaturan</h2><p>Kelola data akun dan ekspor laporan</p></div>
  </div>

  <div class="grid-2" style="align-items:start;gap:1rem">
    <div>
      <div class="card" style="margin-bottom:1.2rem">
        <div style="text-align:center;padding:0.8rem 0 1.2rem">
          <!-- FOTO PASANGAN -->
          <div style="display:flex;justify-content:center;gap:1.5rem;margin-bottom:1rem;flex-wrap:wrap">
            <!-- Foto Pengantin 1 -->
            <div style="text-align:center">
              <div id="photo1-wrap" style="position:relative;width:90px;height:90px;margin:0 auto 6px">
                <div id="photo1-placeholder" style="width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,var(--primary-light),var(--primary));display:flex;align-items:center;justify-content:center;font-size:2rem;border:3px solid var(--white);box-shadow:var(--shadow)">👤</div>
                <img id="photo1-img" src="" alt="" style="display:none;width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid var(--white);box-shadow:var(--shadow)" />
                <label for="input-photo1" style="position:absolute;bottom:0;right:0;width:26px;height:26px;background:var(--primary);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);font-size:0.75rem">📷</label>
                <input type="file" id="input-photo1" accept="image/*" style="display:none" onchange="handlePhoto(event,'photo1')" />
              </div>
              <p style="font-size:0.75rem;color:var(--text-light)" id="label-photo1">Foto Kamu</p>
            </div>
            <!-- Cincin tengah -->
            <div style="display:flex;align-items:center;font-size:1.5rem;padding-top:10px">💍</div>
            <!-- Foto Pengantin 2 -->
            <div style="text-align:center">
              <div id="photo2-wrap" style="position:relative;width:90px;height:90px;margin:0 auto 6px">
                <div id="photo2-placeholder" style="width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,var(--primary-light),var(--primary));display:flex;align-items:center;justify-content:center;font-size:2rem;border:3px solid var(--white);box-shadow:var(--shadow)">👤</div>
                <img id="photo2-img" src="" alt="" style="display:none;width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid var(--white);box-shadow:var(--shadow)" />
                <label for="input-photo2" style="position:absolute;bottom:0;right:0;width:26px;height:26px;background:var(--primary);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);font-size:0.75rem">📷</label>
                <input type="file" id="input-photo2" accept="image/*" style="display:none" onchange="handlePhoto(event,'photo2')" />
              </div>
              <p style="font-size:0.75rem;color:var(--text-light)" id="label-photo2">Foto Pasangan</p>
            </div>
          </div>
          <h3 id="profile-names" style="color:var(--primary-dark);font-size:1.3rem"></h3>
          <p id="profile-date" style="color:var(--text-light);font-size:0.85rem;margin-top:4px"></p>
          <p id="profile-countdown" style="color:var(--primary);font-weight:600;margin-top:6px"></p>
        </div>
        <hr style="border:none;border-top:1px solid var(--border);margin-bottom:1.5rem" />
        <form onsubmit="saveProfile(event)">
          <div class="grid-2">
            <div class="form-group"><label>Nama Kamu</label><input type="text" id="p-name" required /></div>
            <div class="form-group"><label>Nama Pasangan</label><input type="text" id="p-partner" required /></div>
          </div>
          <div class="form-group"><label>Email</label><input type="email" id="p-email" required /></div>
          <div class="form-group"><label>Tanggal Pernikahan</label><input type="date" id="p-date" required /></div>
          <div class="form-group"><label>Lokasi Pernikahan</label><input type="text" id="p-location" placeholder="Contoh: Jakarta, Indonesia" /></div>
          <div class="form-group"><label>Tema Pernikahan</label><input type="text" id="p-theme" placeholder="Contoh: Garden Romantic, Rustic, Modern" /></div>
          <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">💾 Simpan Perubahan</button>
        </form>
      </div>
    </div>

    <div>
      <div class="card" style="margin-bottom:1.2rem">
        <h3 style="font-size:1rem;color:var(--primary-dark);margin-bottom:1.2rem">📊 Ringkasan Data</h3>
        <div id="summary-stats"></div>
      </div>

      <div class="card" style="margin-bottom:1.2rem">
        <h3 style="font-size:1rem;color:var(--primary-dark);margin-bottom:1rem">📤 Ekspor Laporan</h3>
        <div style="display:flex;flex-direction:column;gap:0.8rem">
          <button class="btn btn-outline" style="justify-content:start;gap:12px" onclick="exportBudgetPDF()">
            <span style="font-size:1.2rem">📄</span>
            <div style="text-align:left"><div style="font-weight:600">Laporan Budget</div><div style="font-size:0.75rem;color:var(--text-light)">Export ringkasan budget ke PDF</div></div>
          </button>
          <button class="btn btn-outline" style="justify-content:start;gap:12px" onclick="exportGuestPDF()">
            <span style="font-size:1.2rem">👥</span>
            <div style="text-align:left"><div style="font-weight:600">Daftar Tamu</div><div style="font-size:0.75rem;color:var(--text-light)">Export daftar tamu ke PDF</div></div>
          </button>
          <button class="btn btn-outline" style="justify-content:start;gap:12px" onclick="window.location.href='timeline.html'">
            <span style="font-size:1.2rem">🕐</span>
            <div style="text-align:left"><div style="font-weight:600">Timeline Hari H</div><div style="font-size:0.75rem;color:var(--text-light)">Print rundown dari halaman Timeline</div></div>
          </button>
        </div>
      </div>

      <div class="card" style="border:1.5px solid #ffd0d0">
        <h3 style="font-size:1rem;color:var(--danger);margin-bottom:1rem">⚠️ Zona Berbahaya</h3>
        <p style="font-size:0.85rem;color:var(--text-light);margin-bottom:1rem">Tindakan ini tidak dapat dibatalkan.</p>
        <button class="btn btn-danger btn-sm" onclick="doLogout()">🚪 Logout</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { Auth, Budget, Vendor, Checklist, GuestList, Profile, fmt, setupNav, toast, showLoading } from './js/firebase.js';
  import { updateEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { auth } from './js/firebase.js';

  window.doLogout = () => Auth.logout();

  let uid, profile, bData, vendors, checkItems, guestItems;

  // ===== FOTO HANDLER =====
  window.handlePhoto = (e, key) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) return toast('Ukuran foto maksimal 2MB', 'error');
    const reader = new FileReader();
    reader.onload = async (ev) => {
      const base64 = ev.target.result;
      showPhoto(key, base64);
      await Profile.update(uid, { [key]: base64 });
      profile[key] = base64;
      toast('Foto berhasil disimpan ✨');
    };
    reader.readAsDataURL(file);
  };

  function showPhoto(key, src) {
    const img = document.getElementById(key + '-img');
    const placeholder = document.getElementById(key + '-placeholder');
    if (src) {
      img.src = src;
      img.style.display = 'block';
      placeholder.style.display = 'none';
    } else {
      img.style.display = 'none';
      placeholder.style.display = 'flex';
    }
  }

  function loadUI() {
    document.getElementById('p-name').value = profile.name;
    document.getElementById('p-partner').value = profile.partnerName;
    document.getElementById('p-email').value = profile.email;
    document.getElementById('p-date').value = profile.weddingDate||'';
    document.getElementById('p-location').value = profile.location||'';
    document.getElementById('p-theme').value = profile.theme||'';
    document.getElementById('profile-names').textContent = `${profile.name} & ${profile.partnerName}`;
    document.getElementById('label-photo1').textContent = profile.name || 'Foto Kamu';
    document.getElementById('label-photo2').textContent = profile.partnerName || 'Foto Pasangan';
    showPhoto('photo1', profile.photo1 || '');
    showPhoto('photo2', profile.photo2 || '');
    if (profile.weddingDate) {
      const d = new Date(profile.weddingDate);
      document.getElementById('profile-date').textContent = d.toLocaleDateString('id-ID',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
      const diff = Math.ceil((d - new Date())/86400000);
      document.getElementById('profile-countdown').textContent = diff>0?`⏳ ${diff} hari lagi`:diff===0?'🎉 Hari ini!':'🎊 Sudah menikah!';
    }
    const s = Budget.summary(bData);
    const gs = GuestList.summary(guestItems);
    const prog = Checklist.progress(checkItems);
    document.getElementById('summary-stats').innerHTML = [
      { icon:'💰', label:'Total Budget', val: fmt(s.total) },
      { icon:'✅', label:'Budget Terpakai', val: fmt(s.spent) },
      { icon:'🤝', label:'Vendor Terdaftar', val: vendors.length+' vendor' },
      { icon:'👥', label:'Total Tamu', val: gs.total+' orang ('+gs.totalPax+' kursi)' },
      { icon:'📋', label:'Checklist', val: prog.done+'/'+prog.total+' selesai ('+prog.pct+'%)' },
    ].map(s => `<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)"><span style="font-size:0.85rem;color:var(--text-light)">${s.icon} ${s.label}</span><span style="font-size:0.85rem;font-weight:600">${s.val}</span></div>`).join('');
  }

  window.saveProfile = async (e) => {
    e.preventDefault();
    const data = { name: document.getElementById('p-name').value, partnerName: document.getElementById('p-partner').value, email: document.getElementById('p-email').value, weddingDate: document.getElementById('p-date').value, location: document.getElementById('p-location').value, theme: document.getElementById('p-theme').value };
    await Profile.update(uid, data);
    profile = { ...profile, ...data };
    loadUI(); setupNav(profile); toast('Profil berhasil disimpan! ✨');
  };

  window.exportBudgetPDF = () => {
    const s = Budget.summary(bData);
    const win = window.open('','_blank');
    win.document.write(`<html><head><title>Laporan Budget</title><style>body{font-family:Arial,sans-serif;padding:30px;color:#4a4543}h1{color:#a68566}h2{color:#d4af85;font-size:1rem}table{width:100%;border-collapse:collapse;margin-top:20px}th{background:#e8d5c4;padding:10px;text-align:left;font-size:13px}td{padding:10px;border-bottom:1px solid #eee;font-size:13px}.summary{display:flex;gap:20px;margin:20px 0;flex-wrap:wrap}.sum-box{background:#e8d5c4;padding:12px 20px;border-radius:8px}.sum-box p{margin:0;font-size:12px;color:#8b8580}.sum-box h3{margin:4px 0 0;color:#a68566}.over{color:#c84b4b}</style></head><body>
      <h1>💰 Laporan Budget Pernikahan</h1><h2>${profile.name} & ${profile.partnerName}</h2>
      <div class="summary"><div class="sum-box"><p>Total Budget</p><h3>${fmt(s.total)}</h3></div><div class="sum-box"><p>Direncanakan</p><h3>${fmt(s.planned)}</h3></div><div class="sum-box"><p>Terpakai</p><h3>${fmt(s.spent)}</h3></div><div class="sum-box"><p>Sisa</p><h3 class="${s.remaining<0?'over':''}">${fmt(s.remaining)}</h3></div></div>
      <table><thead><tr><th>Kategori</th><th>Nama Item</th><th>Rencana</th><th>Aktual</th><th>Selisih</th><th>Status</th></tr></thead>
      <tbody>${bData.items.map(i=>{const diff=(i.planned||0)-(i.actual||0);return`<tr><td>${i.category}</td><td>${i.name}</td><td>${fmt(i.planned||0)}</td><td>${fmt(i.actual||0)}</td><td class="${diff<0?'over':''}">${diff>=0?'+':''}${fmt(diff)}</td><td>${i.status}</td></tr>`;}).join('')}</tbody></table>
      <p style="margin-top:20px;font-size:12px;color:#aaa">Dicetak: ${new Date().toLocaleString('id-ID')}</p></body></html>`);
    win.document.close(); win.print();
  };

  window.exportGuestPDF = () => {
    const gs = GuestList.summary(guestItems);
    const win = window.open('','_blank');
    win.document.write(`<html><head><title>Daftar Tamu</title><style>body{font-family:Arial,sans-serif;padding:30px;color:#4a4543}h1{color:#a68566}h2{color:#d4af85;font-size:1rem}table{width:100%;border-collapse:collapse;margin-top:20px}th{background:#e8d5c4;padding:10px;text-align:left;font-size:13px}td{padding:10px;border-bottom:1px solid #eee;font-size:13px}.summary{display:flex;gap:20px;margin:20px 0;flex-wrap:wrap}.sum-box{background:#e8d5c4;padding:12px 20px;border-radius:8px}.sum-box p{margin:0;font-size:12px;color:#8b8580}.sum-box h3{margin:4px 0 0;color:#a68566}</style></head><body>
      <h1>👥 Daftar Tamu Pernikahan</h1><h2>${profile.name} & ${profile.partnerName}</h2>
      <div class="summary"><div class="sum-box"><p>Total Tamu</p><h3>${gs.total}</h3></div><div class="sum-box"><p>Hadir</p><h3>${gs.confirmed}</h3></div><div class="sum-box"><p>Belum Konfirmasi</p><h3>${gs.pending}</h3></div><div class="sum-box"><p>Total Kursi</p><h3>${gs.totalPax}</h3></div></div>
      <table><thead><tr><th>No</th><th>Nama</th><th>Kelompok</th><th>Kontak</th><th>Pax</th><th>RSVP</th><th>Undangan</th></tr></thead>
      <tbody>${guestItems.map((g,i)=>`<tr><td>${i+1}</td><td>${g.name}</td><td>${g.group||'-'}</td><td>${g.phone||'-'}</td><td>${g.pax||1}</td><td>${g.rsvp}</td><td>${g.invited?'✅ Terkirim':'Belum'}</td></tr>`).join('')}</tbody></table>
      <p style="margin-top:20px;font-size:12px;color:#aaa">Dicetak: ${new Date().toLocaleString('id-ID')}</p></body></html>`);
    win.document.close(); win.print();
  };

  Auth.requireAuth(async (user) => {
    showLoading(true);
    uid = user.uid;
    [profile, bData, vendors, checkItems, guestItems] = await Promise.all([
      Auth.getProfile(), Budget.get(uid), Vendor.getAll(uid), Checklist.getAll(uid), GuestList.getAll(uid)
    ]);
    setupNav(profile);
    loadUI();
    showLoading(false);
  });
</script>
</body>
</html>
