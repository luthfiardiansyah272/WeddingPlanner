<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timeline – Wedding Planner</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .timeline-wrap { position:relative;padding-left:40px; }
    .timeline-wrap::before { content:'';position:absolute;left:16px;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,var(--primary-light),var(--primary)); }
    .timeline-item { position:relative;margin-bottom:1.2rem; }
    .timeline-dot { position:absolute;left:-32px;top:14px;width:14px;height:14px;border-radius:50%;background:var(--primary);border:3px solid var(--white);box-shadow:0 0 0 2px var(--primary); }
    .timeline-card { background:var(--white);border-radius:var(--radius-sm);padding:1rem 1.2rem;box-shadow:var(--shadow);display:flex;align-items:center;gap:1rem;transition:box-shadow 0.2s; }
    .timeline-card:hover { box-shadow:var(--shadow-hover); }
    .timeline-time { font-size:1.1rem;font-weight:700;color:var(--primary-dark);min-width:60px;font-family:'Poppins',sans-serif; }
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-brand">💍 Wedding Planner</a>
  <button class="nav-toggle" id="nav-toggle" onclick="document.getElementById('nav-links').classList.toggle('open')"><span></span><span></span><span></span></button>
  <div class="nav-links" id="nav-links">
    <a href="index.html">🏠 <span>Dashboard</span></a>
    <a href="budget.html">💰 <span>Budget</span></a>
    <a href="vendors.html">🤝 <span>Vendor</span></a>
    <a href="recommendations.html">⭐ <span>Rekomendasi</span></a>
    <a href="checklist.html">✅ <span>Checklist</span></a>
    <a href="seserahan.html">🎁 <span>Seserahan</span></a>
    <a href="guestlist.html">👥 <span>Tamu</span></a>
    <a href="timeline.html">🕐 <span>Timeline</span></a>
    <a href="profile.html">👤 <span>Profil</span></a>
  </div>
  <div class="nav-user"><span id="nav-user-name"></span><button class="btn-logout" onclick="doLogout()">Keluar</button></div>
</nav>

<div class="container">
  <div class="page-header">
    <div><h2>🕐 Timeline Hari H</h2><p>Rundown acara pernikahan Anda</p></div>
    <div style="display:flex;gap:0.6rem;flex-wrap:wrap">
      <button class="btn btn-outline" style="flex:1;justify-content:center" onclick="printTimeline()">🖨️ Print</button>
      <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="openAddModal()">+ Tambah Acara</button>
    </div>
  </div>

  <div class="card" style="margin-bottom:1.5rem;background:linear-gradient(135deg,var(--primary-light),var(--nude-dark))">
    <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap">
      <div style="font-size:2rem">💍</div>
      <div style="flex:1;min-width:0">
        <h3 id="wedding-names" style="color:var(--primary-dark);font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></h3>
        <p id="wedding-date-full" style="color:var(--text-light);font-size:0.82rem"></p>
      </div>
      <div style="text-align:right;flex-shrink:0"><p style="font-size:0.75rem;color:var(--text-light)">Total Acara</p><p id="total-events" style="font-size:1.4rem;font-weight:700;color:var(--primary-dark)">0</p></div>
    </div>
  </div>

  <div class="card" id="timeline-container" style="padding:1.5rem 2rem"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-event">
  <div class="modal" style="max-width:500px">
    <div class="modal-header"><h3 id="modal-event-title">Tambah Acara</h3><button class="btn-close" onclick="closeModal('modal-event')">✕</button></div>
    <input type="hidden" id="e-edit-id" />
    <div class="grid-2">
      <div class="form-group"><label>Waktu</label><input type="time" id="e-time" /></div>
      <div class="form-group"><label>Kategori</label>
        <select id="e-category"><option>Persiapan</option><option>Venue</option><option>Akad</option><option>Dokumentasi</option><option>Resepsi</option><option>Hiburan</option><option>Penutup</option></select>
      </div>
    </div>
    <div class="form-group"><label>Nama Acara</label><input type="text" id="e-event" placeholder="Contoh: Prosesi Akad Nikah" /></div>
    <div class="form-group"><label>Deskripsi</label><textarea id="e-desc" rows="2" placeholder="Detail acara..."></textarea></div>
    <div class="form-group"><label>Penanggung Jawab (PIC)</label><input type="text" id="e-pic" placeholder="Contoh: MC, Fotografer, Panitia" /></div>
    <div style="display:flex;gap:0.8rem">
      <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="saveEvent()">Simpan</button>
      <button class="btn btn-outline" onclick="closeModal('modal-event')">Batal</button>
    </div>
  </div>
</div>

<script type="module">
  import { Auth, Timeline, setupNav, toast, openModal, closeModal, showLoading, fmt } from './js/firebase.js';

  window.doLogout = () => Auth.logout();
  window.openModal = openModal;
  window.closeModal = closeModal;

  let uid, allEvents = [], profile;
  const catBadge = { Persiapan:'badge-pink', Venue:'badge-green', Akad:'badge-yellow', Dokumentasi:'badge-blue', Resepsi:'badge-pink', Hiburan:'badge-blue', Penutup:'badge-yellow' };

  function render() {
    document.getElementById('total-events').textContent = allEvents.length;
    const el = document.getElementById('timeline-container');
    if (!allEvents.length) { el.innerHTML = '<div class="empty-state"><div class="empty-icon">🕐</div><p>Belum ada acara. Tambahkan rundown hari H Anda!</p></div>'; return; }
    el.innerHTML = `<div class="timeline-wrap">${allEvents.map(e => `
      <div class="timeline-item">
        <div class="timeline-dot"></div>
        <div class="timeline-card" style="flex-wrap:wrap">
          <div class="timeline-time">${e.time}</div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap">
              <strong style="font-size:0.95rem">${e.event}</strong>
              <span class="badge ${catBadge[e.category]||'badge-pink'}">${e.category}</span>
            </div>
            ${e.desc?`<p style="font-size:0.82rem;color:var(--text-light);margin-bottom:3px">${e.desc}</p>`:''}
            ${e.pic?`<p style="font-size:0.8rem;color:var(--primary-dark)">👤 ${e.pic}</p>`:''}
          </div>
          <div style="display:flex;gap:6px;flex-shrink:0">
            <button class="btn btn-outline btn-sm" onclick="editEvent('${e.id}')">✏️</button>
            <button class="btn btn-danger btn-sm" onclick="deleteEvent('${e.id}')">🗑️</button>
          </div>
        </div>
      </div>`).join('')}</div>`;
  }

  window.openAddModal = () => {
    document.getElementById('e-edit-id').value = '';
    document.getElementById('modal-event-title').textContent = 'Tambah Acara';
    ['e-event','e-desc','e-pic'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('e-time').value = '08:00';
    openModal('modal-event');
  };

  window.editEvent = (id) => {
    const e = allEvents.find(x => x.id === id);
    if (!e) return;
    document.getElementById('e-edit-id').value = id;
    document.getElementById('modal-event-title').textContent = 'Edit Acara';
    document.getElementById('e-time').value = e.time;
    document.getElementById('e-category').value = e.category;
    document.getElementById('e-event').value = e.event;
    document.getElementById('e-desc').value = e.desc||'';
    document.getElementById('e-pic').value = e.pic||'';
    openModal('modal-event');
  };

  window.saveEvent = async () => {
    const event = document.getElementById('e-event').value.trim();
    const time = document.getElementById('e-time').value;
    if (!event || !time) return toast('Waktu dan nama acara wajib diisi', 'error');
    const id = document.getElementById('e-edit-id').value;
    const data = { time, category: document.getElementById('e-category').value, event, desc: document.getElementById('e-desc').value, pic: document.getElementById('e-pic').value };
    if (id) await Timeline.update(uid, id, data);
    else await Timeline.add(uid, data);
    allEvents = await Timeline.getAll(uid);
    closeModal('modal-event'); toast(id?'Acara diperbarui':'Acara ditambahkan'); render();
  };

  window.deleteEvent = async (id) => {
    if (!confirm('Hapus acara ini?')) return;
    await Timeline.delete(uid, id);
    allEvents = await Timeline.getAll(uid);
    toast('Acara dihapus'); render();
  };

  window.printTimeline = () => {
    const dateStr = profile?.weddingDate ? new Date(profile.weddingDate).toLocaleDateString('id-ID',{weekday:'long',year:'numeric',month:'long',day:'numeric'}) : '';
    const win = window.open('','_blank');
    win.document.write(`<html><head><title>Timeline Pernikahan</title><style>body{font-family:Arial,sans-serif;padding:30px;color:#333}h1{color:#a07070;text-align:center}p.sub{text-align:center;color:#888;margin-bottom:30px}table{width:100%;border-collapse:collapse}th{background:#f5ebe0;padding:10px;text-align:left}td{padding:10px;border-bottom:1px solid #eee}.cat{background:#e8c9c9;padding:2px 8px;border-radius:10px;font-size:12px}</style></head><body>
      <h1>💍 Timeline Pernikahan</h1><p class="sub">${profile?.name} & ${profile?.partnerName} — ${dateStr}</p>
      <table><thead><tr><th>Waktu</th><th>Acara</th><th>Kategori</th><th>Deskripsi</th><th>PIC</th></tr></thead>
      <tbody>${allEvents.map(e=>`<tr><td><strong>${e.time}</strong></td><td>${e.event}</td><td><span class="cat">${e.category}</span></td><td>${e.desc||'-'}</td><td>${e.pic||'-'}</td></tr>`).join('')}</tbody>
      </table></body></html>`);
    win.document.close(); win.print();
  };

  Auth.requireAuth(async (user) => {
    showLoading(true);
    uid = user.uid;
    profile = await Auth.getProfile();
    setupNav(profile);
    document.getElementById('wedding-names').textContent = `${profile.name} & ${profile.partnerName}`;
    if (profile.weddingDate) document.getElementById('wedding-date-full').textContent = new Date(profile.weddingDate).toLocaleDateString('id-ID',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
    allEvents = await Timeline.getAll(uid);
    render(); showLoading(false);
  });
</script>
</body>
</html>
